name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq socat mpv imagemagick
      # Tests that need a desktop session (audio, D-Bus media players) skip themselves here.
      - name: Run tests
        run: tests/run.sh
